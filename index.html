<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000005">
<title>Solar System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header id="title">Solar System <span>sizes &amp; distances not to scale</span></header>
<aside id="info" hidden>
  <button id="close" aria-label="Close">×</button>
  <h2 id="i-name"></h2>
  <p id="i-blurb"></p>
  <dl id="i-facts"></dl>
</aside>
<nav id="bar">
  <button id="play" aria-label="Pause">❚❚</button>
  <label class="speed"><span id="speedTxt">1 yr / 20 s</span>
    <input id="speed" type="range" min="-2" max="2" step="0.01" value="0" aria-label="Simulation speed"></label>
  <button id="trails" class="on" aria-pressed="true">Trails</button>
  <button id="lbls" class="on" aria-pressed="true">Labels</button>
  <button id="reset">Reset</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
