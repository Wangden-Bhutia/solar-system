name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js data.js lab.js lab-state.js tour.js sources.js sources-page.js resume.js sheet.js science.js insights.js learn.js stars.js stars-data.js galaxy.js galaxy-data.js zoom-ladder.js zoom.js zoomlog.js labels.js lod.js frames.js transition.js transition-data.js hud.js here.js sky-math.js my-sky.js cosmic-calendar.js cosmic-year.js cosmic-backdrop.js cosmic-world.js galaxy-motion.js star-motion.js star-pairs.js local.js local-data.js cosmos.js cosmos-data.js laniakea-data.js sky.js experiments.js voice-player.js adventure.js textures.js land.js sw.js manifest.webmanifest icon-192.png icon-512.png voice vendor textures _site/
          touch _site/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache-bust CSS and module URLs with the commit
        run: node tools/stamp.mjs _site "${GITHUB_SHA::12}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
